name: PR 2 isolated macOS GUI acceptance
on:
  push:
    branches: [qa/pr-2-gui-acceptance-20261014]
permissions:
  contents: read
concurrency:
  group: pr2-isolated-gui-qa
  cancel-in-progress: false
jobs:
  gui-preflight:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read isolated desktop capabilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output/gui-qa
          xcrun swift scripts/stage-manager-gui-qa/preflight.swift > test-output/gui-qa/preflight.json
          cat test-output/gui-qa/preflight.json
          /usr/sbin/screencapture -x test-output/gui-qa/desktop-preflight.png
          /usr/bin/sips -g pixelWidth -g pixelHeight test-output/gui-qa/desktop-preflight.png
      - name: Collect disposable-runner evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr2-gui-preflight
          path: test-output/gui-qa/
          retention-days: 3
