name: PR 6 native policy diagnostics
on:
  push:
    branches: [qa/pr-6-gui-acceptance-20261015]
permissions:
  contents: read
concurrency:
  group: pr6-isolated-gui-qa
  cancel-in-progress: false
jobs:
  gui-evidence:
    runs-on: macos-26
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: regular-default-spaces
            revision: 5eda5830b82277e0decf25b61f23dc3dea967bea
            space-switching: default
          - variant: regular-no-auto-spaces
            revision: 5eda5830b82277e0decf25b61f23dc3dea967bea
            space-switching: off
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ matrix.revision }}
          path: production
          persist-credentials: false
      - name: Read isolated desktop capabilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output/gui-qa
          xcrun swift scripts/stage-manager-gui-qa/preflight.swift > test-output/gui-qa/preflight.json
          git -C production rev-parse HEAD > test-output/gui-qa/tested-revision.txt
          git rev-parse HEAD > test-output/gui-qa/harness-revision.txt
      - name: Build trace-only diagnostic candidate and QA helpers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/stage-manager-gui-qa/trace-panel-defer.py production
          git -C production diff > test-output/gui-qa/diagnostic-only.patch
          printf '%s\n' 'DIAGNOSTIC BUILD; NOT PRODUCTION ACCEPTANCE' > test-output/gui-qa/diagnostic-only.txt
          env -u YOMADO_SIGNING_IDENTITY bash production/build.sh
          shasum -a 256 production/dist/Yomado.app/Contents/MacOS/Yomado > test-output/gui-qa/tested-binary.sha256
          bash scripts/stage-manager-gui-qa/build-helpers.sh "$RUNNER_TEMP/yomado-gui-helpers"
      - name: Verify actual Space-switching setting in disposable guest
        shell: bash
        run: |
          bash scripts/stage-manager-gui-qa/setup-space-switch.sh "$RUNNER_TEMP/yomado-gui-helpers" "$GITHUB_WORKSPACE/test-output/gui-qa/space-switching" "${{ matrix.space-switching }}"
      - name: Configure only the disposable guest and record UI
        shell: bash
        run: |
          bash scripts/stage-manager-gui-qa/setup-guest.sh "$RUNNER_TEMP/yomado-gui-helpers" "$GITHUB_WORKSPACE/test-output/gui-qa/setup"
      - name: Repeat isolated close after minimize and menu restore
        env:
          YM_QA_STRESS_CYCLES: "20"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          bash scripts/stage-manager-gui-qa/lifecycle-stress.sh "$GITHUB_WORKSPACE/production/dist/Yomado.app" "$RUNNER_TEMP/yomado-gui-helpers" "$GITHUB_WORKSPACE/test-output/gui-qa/lifecycle-stress"
      - name: Verify product-owned virtual display persists with closed panel
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          bash scripts/stage-manager-gui-qa/virtual-persistence-scenarios.sh "$GITHUB_WORKSPACE/production/dist/Yomado.app" "$RUNNER_TEMP/yomado-gui-helpers" "$GITHUB_WORKSPACE/test-output/gui-qa/virtual-persistence"
      - name: Collect disposable-runner evidence for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr6-gui-${{ matrix.variant }}
          path: test-output/gui-qa/
          retention-days: 7
