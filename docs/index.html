<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Watch a 60-second narrated demonstration of yomado, a virtual work screen for visual agents.">
    <title>yomado — 60-second demo</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0b0d13; color: #f3f4f8; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; padding: 36px 24px; }
      main { max-width: 1120px; margin: 0 auto; }
      header, footer, nav { display: flex; align-items: center; gap: 18px; }
      header { justify-content: space-between; margin-bottom: 38px; }
      a { color: inherit; text-decoration: none; text-underline-offset: 4px; }
      a:hover { text-decoration: underline; }
      a:focus-visible { outline: 2px solid #b8b2ff; outline-offset: 6px; border-radius: 3px; }
      .brand { font-size: 24px; font-weight: 700; letter-spacing: -1px; }
      nav { font-size: 14px; }
      nav a { color: #a1a7b8; padding: 6px 0; }
      nav a[aria-current="true"] { color: #f3f4f8; text-decoration: underline; }
      h1 { font-size: clamp(25px, 4vw, 38px); font-weight: 600; letter-spacing: -.8px; margin: 0 0 12px; }
      .intro { color: #b7bccb; line-height: 1.6; margin: 0 0 25px; max-width: 760px; }
      video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #030409; border: 1px solid #292d3b; border-radius: 14px; }
      .caption { color: #949cac; font-size: 13px; line-height: 1.6; margin: 13px 0 28px; }
      footer { justify-content: space-between; flex-wrap: wrap; color: #c5cad8; font-size: 14px; padding-bottom: 8px; }
      .links { display: flex; flex-wrap: wrap; gap: 20px; }
      @media (max-width: 600px) { body { padding: 24px 16px; } header { margin-bottom: 30px; } video { border-radius: 9px; } .intro { font-size: 15px; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="https://yomado.app/" aria-label="yomado website">yomado</a>
        <nav aria-label="Video language">
          <a id="english" href="?lang=en" lang="en">English</a>
          <a id="chinese" href="?lang=zh-CN" lang="zh-CN">简体中文</a>
        </nav>
      </header>
      <h1 id="heading">See yomado in 60 seconds.</h1>
      <p class="intro" id="intro">A virtual screen for Codex and other visual agents to work with Blender, Marvelous Designer, and desktop apps.</p>
      <video id="demo" controls playsinline preload="metadata" poster="media/yomado-en-poster.jpg" aria-label="yomado demo with English narration">
        <source id="video-source" src="media/yomado-en-river.mp4" type="video/mp4">
        <p><a href="media/yomado-en-river.mp4">Download the English MP4</a> · <a href="media/yomado-zh-cn-river.mp4">下载中文 MP4</a></p>
      </video>
      <p class="caption" id="caption">60-second simulated product demo with narration.</p>
      <footer>
        <div class="links">
          <a id="download" href="media/yomado-en-river.mp4" download="yomado-en-river.mp4">Download MP4</a>
          <a href="https://github.com/chekusu/yomado">GitHub ↗</a>
        </div>
        <a href="https://yomado.app/">yomado.app ↗</a>
      </footer>
    </main>
    <script>
      const requestedLanguage = new URLSearchParams(window.location.search).get('lang');
      const chinese = requestedLanguage === 'zh-CN' ||
        (!requestedLanguage && navigator.language.toLowerCase().startsWith('zh'));
      const language = chinese ? 'zh-CN' : 'en';
      const mediaLanguage = chinese ? 'zh-cn' : 'en';
      document.documentElement.lang = language;
      document.getElementById(chinese ? 'chinese' : 'english').setAttribute('aria-current', 'true');
      const video = document.getElementById('demo');
      const source = document.getElementById('video-source');
      const download = document.getElementById('download');
      const filename = `yomado-${mediaLanguage}-river.mp4`;
      video.poster = `media/yomado-${mediaLanguage}-poster.jpg`;
      source.src = `media/${filename}`;
      download.href = source.src;
      download.download = filename;
      if (chinese) {
        document.title = 'yomado — 60 秒演示';
        document.getElementById('heading').textContent = '60 秒看懂 yomado。';
        document.getElementById('intro').textContent = '给 Codex 等视觉 Agent 一块虚拟屏，用来操作 Blender、Marvelous Designer 和其他桌面软件。';
        document.getElementById('caption').textContent = '60 秒产品功能模拟演示，含中文人声配音。';
        document.querySelector('nav').setAttribute('aria-label', '视频语言');
        video.setAttribute('aria-label', 'yomado 中文配音演示');
        download.textContent = '下载 MP4';
        document.querySelector('meta[name="description"]').content = '观看 yomado 的 60 秒中文配音演示：为 Codex 等视觉 Agent 提供虚拟工作屏。';
      }
      video.load();
    </script>
  </body>
</html>
